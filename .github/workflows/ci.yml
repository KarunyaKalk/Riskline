name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Migrations & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devops_risk_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devops_risk_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devops_risk_test_db
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devops_risk_test_db
          JWT_SECRET_KEY: test-secret-key-ci-pipeline
          JWT_REFRESH_SECRET_KEY: test-refresh-secret-key-ci-pipeline
        run: |
          PYTHONPATH=backend pytest backend/tests -v

  frontend-build:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Type-Check
        run: |
          cd frontend
          npm run type-check

      - name: Frontend Build
        run: |
          cd frontend
          npm run build
