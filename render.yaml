# Render Blueprint Configuration for Riskline Backend & Database Stack
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: riskline-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://karunyakalk.github.io,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: riskline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: riskline-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true

  # 2. Managed Redis Cache & Event Bus
  - type: redis
    name: riskline-redis
    region: oregon
    plan: free

databases:
  # 3. PostgreSQL Database Instance (with pgvector support)
  - name: riskline-db
    databaseName: devops_risk_db
    user: postgres
    region: oregon
    plan: free
